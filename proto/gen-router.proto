syntax = "proto2";

package genrouter;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/xieweiyu/protoc-gen-rpc-dispatcher/genrouter;genrouter";

// 标记一个 RPC 为 dispatcher 入口
// 每个 service 中只能有一个 RPC 标记为 is_dispatcher = true
// 这个 RPC 会被 protoc-gen-router 跳过，不生成 wrapper handler
extend google.protobuf.MethodOptions {
  optional bool is_dispatcher = 50001;
}